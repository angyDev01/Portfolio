<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240" role="img" aria-label="Palette Angy.Dev">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Inter, Arial, sans-serif">
    <!-- Swatches -->
    <g transform="translate(40,24)">
      <rect x="0" y="0" width="160" height="160" rx="12" fill="#0b61b3"/>
      <text x="180" y="36" font-size="18" fill="#072033">Primary</text>
      <text x="180" y="64" font-size="14" fill="#5b6b80">#0B61B3</text>

      <rect x="0" y="176" width="160" height="40" rx="8" fill="#2EA0FF"/>
      <text x="180" y="206" font-size="14" fill="#072033">Accent — #2EA0FF</text>
    </g>

    <g transform="translate(320,24)">
      <rect x="0" y="0" width="160" height="80" rx="10" fill="#ffffff" stroke="#e6f2ff"/>
      <text x="180" y="36" font-size="18" fill="#072033">Surface / Background</text>
      <text x="180" y="64" font-size="14" fill="#5b6b80">#FFFFFF / #F6FBFF</text>

      <rect x="0" y="96" width="160" height="40" rx="8" fill="#f6fbff"/>
      <text x="180" y="128" font-size="14" fill="#072033">Surface — #F6FBFF</text>
    </g>

    <g transform="translate(560,24)">
      <rect x="0" y="0" width="160" height="160" rx="12" fill="#eef6ff" stroke="#d9eefe"/>
      <text x="180" y="36" font-size="18" fill="#072033">Muted / Text</text>
      <text x="180" y="64" font-size="14" fill="#5b6b80">#5B6B80</text>

      <rect x="0" y="176" width="160" height="40" rx="8" fill="#072033"/>
      <text x="180" y="206" font-size="14" fill="#ffffff">Text Dark — #072033</text>
    </g>

    <!-- Footer note -->
    <text x="40" y="232" font-size="12" fill="#5b6b80">Design tokens: primary, accent, surface, muted, text. Use pill buttons, large whitespace, subtle shadows.</text>
  </g>
